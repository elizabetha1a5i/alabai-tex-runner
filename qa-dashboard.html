<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="pragma" content="no-cache" />
<meta http-equiv="expires" content="0" />
<title>Tex QA Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --blue:        #258ed8;
    --blue-light:  #e8f4fd;
    --blue-dark:   #080331;
    --pink:        #dd23bb;
    --bg:          #f5f6fa;
    --surface:     #ffffff;
    --text:        #0f1e2d;
    --text-mid:    #5a6478;
    --text-light:  #9ea3b8;
    --border:      #e8eaf2;
    --green:       #137333;
    --green-bg:    #e6f4ea;
    --amber:       #7a5200;
    --amber-bg:    #fef9e7;
    --amber-border:#fde68a;
    --red:         #b91c1c;
    --red-bg:      #fef2f2;
    --shadow:      0 1px 3px rgba(15,30,45,.06), 0 4px 16px rgba(15,30,45,.05);
    --radius:      12px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Montserrat',sans-serif; background:var(--bg); color:var(--text); font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased; }

  /* ── Header ── */
  .header { background:var(--surface); border-bottom:1px solid var(--border); padding:18px 40px 14px; }
  .header-top { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:10px; }
  .header-title { font-size:22px; font-weight:800; color:var(--text); letter-spacing:-.4px; }
  .header-right { display:flex; align-items:center; gap:14px; }
  .header-date { font-size:13px; color:var(--text-light); font-weight:500; text-align:right; }
  .header-date strong { display:block; color:var(--text); font-weight:700; font-size:14px; }
  .header-tags { display:flex; gap:6px; flex-wrap:wrap; }
  .badge { font-size:10px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; padding:4px 12px; border-radius:20px; }
  .badge.staging    { background:#dbeafe; color:#1e40af; }
  .badge.production { background:var(--green-bg); color:var(--green); }
  .badge.criteria   { background:#ede9fe; color:#5b21b6; }
  .badge.custom     { background:var(--amber-bg); color:var(--amber); }
  .badge.feedback   { background:#fce7f3; color:#9d174d; }
  .badge.week       { background:var(--green-bg); color:var(--green); }

  /* ── Toolbar ── */
  .toolbar { background:var(--surface); border-bottom:1px solid var(--border); padding:8px 40px; display:flex; gap:8px; align-items:center; }
  .toolbar-btn { border:1.5px solid var(--border); background:var(--bg); border-radius:8px; padding:6px 16px; font-size:11px; font-weight:600; cursor:pointer; font-family:'Montserrat',sans-serif; color:var(--text-mid); letter-spacing:.3px; transition:all .15s; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
  .toolbar-btn:hover { border-color:var(--blue); color:var(--blue); background:var(--blue-light); }
  .toolbar-btn.primary { background:var(--blue); color:#fff; border-color:var(--blue); }
  .toolbar-btn.primary:hover { background:#1a7bbf; border-color:#1a7bbf; }
  .toolbar-btn.accent { background:var(--pink); color:#fff; border-color:var(--pink); }
  .toolbar-btn.accent:hover { background:#be1ea0; border-color:#be1ea0; }

  /* ── Nav bar ── */
  .nav-bar { background:var(--surface); border-bottom:1px solid var(--border); padding:0 40px; display:flex; align-items:center; gap:4px; }
  .tab-btn { padding:13px 18px; font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--text-light); border:none; border-bottom:2px solid transparent; background:none; cursor:pointer; font-family:'Montserrat',sans-serif; transition:all .15s; }
  .tab-btn:hover { color:var(--text-mid); }
  .tab-btn.active { color:var(--blue); border-bottom-color:var(--blue); }
  .nav-sep { width:1px; height:18px; background:var(--border); margin:0 6px; }
  .type-lbl { font-size:9px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--text-light); margin:0 4px 0 8px; }
  .pill-btn { padding:5px 14px; border-radius:20px; font-size:10px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; border:1.5px solid var(--border); background:transparent; color:var(--text-light); cursor:pointer; font-family:'Montserrat',sans-serif; transition:all .15s; margin:8px 2px; }
  .pill-btn:hover { border-color:var(--blue); color:var(--blue); }
  .pill-btn.active { background:var(--blue); border-color:var(--blue); color:#fff; }

  /* ── Filter bar ── */
  .filter-bar { background:var(--bg); border-bottom:1px solid var(--border); padding:8px 40px; display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
  .filter-group { display:flex; align-items:center; gap:8px; }
  .filter-bar label { font-size:10px; font-weight:700; letter-spacing:.7px; text-transform:uppercase; color:var(--text-light); }
  .filter-bar select, .filter-bar input[type="date"] { border:1.5px solid var(--border); border-radius:8px; padding:5px 12px; font-size:12px; font-family:'Montserrat',sans-serif; background:var(--surface); color:var(--text); outline:none; font-weight:500; }
  .filter-bar select:focus, .filter-bar input[type="date"]:focus { border-color:var(--blue); }

  /* ── Main layout ── */
  .main { max-width:900px; margin:0 auto; padding:32px 24px; }
  .section-label { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--text-light); margin-bottom:10px; }

  /* ── Warning banner ── */
  .warn-banner { background:var(--amber-bg); border:1px solid var(--amber-border); border-radius:var(--radius); padding:14px 18px; margin-bottom:24px; font-size:12.5px; color:var(--amber); line-height:1.65; font-weight:500; display:flex; gap:10px; align-items:flex-start; }
  .warn-banner strong { font-weight:700; }

  /* ── Summary card ── */
  .summary-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 22px; margin-bottom:28px; font-size:13px; color:var(--text-mid); line-height:1.75; box-shadow:var(--shadow); }
  .summary-card strong { color:var(--text); font-weight:700; }

  /* ── KPI grid ── */
  .kpi-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:28px; }
  .kpi { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px 26px; box-shadow:var(--shadow); }
  .kpi-label { font-size:9px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-light); margin-bottom:14px; }
  .kpi-num { font-size:46px; font-weight:800; color:var(--text); line-height:1; margin-bottom:14px; letter-spacing:-2px; }
  .kpi-num .unit { font-size:26px; font-weight:400; color:var(--text-light); letter-spacing:0; }
  .chip { display:inline-flex; align-items:center; font-size:11px; font-weight:600; padding:4px 12px; border-radius:20px; }
  .chip.green  { background:var(--green-bg); color:var(--green); }
  .chip.amber  { background:var(--amber-bg); color:var(--amber); }
  .chip.blue   { background:var(--blue-light); color:var(--blue); }
  .chip.red    { background:var(--red-bg); color:var(--red); }

  /* ── Cards ── */
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px; box-shadow:var(--shadow); }
  .card h3 { font-size:14px; font-weight:700; color:var(--text); margin-bottom:3px; }
  .card-sub { font-size:12px; color:var(--text-light); margin-bottom:20px; font-weight:500; }
  .two-col { display:grid; grid-template-columns:1.4fr 1fr; gap:12px; margin-bottom:28px; }

  /* ── Category bars ── */
  .cat-bars { display:flex; flex-direction:column; gap:14px; }
  .cat-row { display:flex; flex-direction:column; gap:6px; }
  .cat-label { display:flex; justify-content:space-between; font-size:11px; color:var(--text-mid); font-weight:600; }
  .cat-pct { font-weight:700; color:var(--text); }
  .bar-track { background:var(--bg); border-radius:99px; height:7px; overflow:hidden; }
  .bar-fill  { height:7px; border-radius:99px; transition:width .5s ease; }
  .bar-fill.full    { background:var(--blue); }
  .bar-fill.partial { background:#f0c040; }
  .bar-fill.fail    { background:var(--red); }

  /* ── Donut ── */
  .donut-wrap { display:flex; align-items:center; gap:24px; }
  .donut-legend { display:flex; flex-direction:column; gap:12px; flex:1; }
  .legend-item { display:flex; align-items:center; gap:10px; font-size:12px; color:var(--text-mid); font-weight:500; }
  .legend-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .legend-val { font-weight:700; color:var(--text); margin-left:auto; }

  /* ── Trend ── */
  .trend-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px; margin-bottom:28px; box-shadow:var(--shadow); }
  .trend-wrap { margin-top:16px; overflow-x:auto; }

  /* ── Issue tracker ── */
  .issue-list { display:flex; flex-direction:column; margin-bottom:28px; border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); }
  .issue-header-card { background:var(--surface); border:1px solid var(--border); padding:18px 24px 14px; border-bottom:none; }
  .issue-header-card h3 { font-size:14px; font-weight:700; color:var(--text); margin-bottom:3px; }
  .issue-header-card p  { font-size:12px; color:var(--text-light); font-weight:500; }
  .issue-item { background:var(--surface); border:1px solid var(--border); border-top:none; padding:14px 24px; display:flex; flex-direction:column; gap:7px; }
  .issue-item-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .issue-name  { font-size:12px; font-weight:600; color:var(--text-mid); }
  .issue-count { font-size:11px; color:var(--text-light); font-weight:500; }
  .issue-score { font-size:15px; font-weight:800; color:var(--text); white-space:nowrap; }
  .issue-pct   { font-size:13px; font-weight:600; color:var(--text-mid); }
  .issue-delta { font-size:11px; font-weight:600; padding:3px 10px; border-radius:20px; white-space:nowrap; }
  .issue-delta.up   { background:var(--blue-light); color:var(--blue); }
  .issue-delta.down { background:var(--red-bg);     color:var(--red); }
  .issue-delta.same { background:var(--bg); color:var(--text-light); border:1px solid var(--border); }
  .resolved-chip { font-size:10px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--green); background:var(--green-bg); padding:3px 10px; border-radius:20px; white-space:nowrap; }
  .open-chip    { font-size:10px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--amber); background:var(--amber-bg); padding:3px 10px; border-radius:20px; white-space:nowrap; }
  .issue-date   { font-size:10px; color:var(--text-light); margin-left:auto; white-space:nowrap; }

  /* ── Partials ── */
  .partial-list { display:flex; flex-direction:column; gap:8px; margin-bottom:28px; }
  .partial-item { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow); }
  .partial-item.overridden { border-color:var(--green); background:var(--green-bg); opacity:.85; }
  .partial-header { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:10px; }
  .partial-name    { font-size:13px; font-weight:700; color:var(--text); }
  .partial-badge   { font-size:10px; font-weight:700; color:var(--amber); background:var(--amber-bg); padding:3px 10px; border-radius:20px; border:1px solid var(--amber-border); white-space:nowrap; }
  .partial-footer  { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .criteria-tag    { font-size:10px; font-weight:600; padding:3px 10px; border-radius:20px; background:var(--red-bg); color:var(--red); border:1px solid #fca5a5; white-space:nowrap; }
  .criteria-tag.warn { background:var(--amber-bg); color:var(--amber); border-color:var(--amber-border); }
  .link-btn        { font-size:10px; font-weight:600; color:var(--blue); text-decoration:none; padding:3px 10px; border-radius:20px; border:1px solid var(--blue-light); background:var(--blue-light); white-space:nowrap; }
  .link-btn:hover  { background:#c7e5f7; }
  .override-btn    { font-size:10px; font-weight:700; padding:3px 12px; border-radius:20px; border:1.5px solid var(--border); background:transparent; color:var(--text-light); cursor:pointer; font-family:'Montserrat',sans-serif; transition:all .15s; margin-left:auto; white-space:nowrap; }
  .override-btn:hover  { border-color:var(--green); color:var(--green); }
  .override-btn.active { background:var(--green-bg); border-color:var(--green); color:var(--green); }
  .override-note   { font-size:10px; color:var(--green); font-weight:600; }

  /* ── Fails list ── */
  .fail-list { display:flex; flex-direction:column; gap:8px; margin-bottom:28px; }
  .fail-item { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow); }
  .fail-item.overridden { border-color:var(--green); background:var(--green-bg); opacity:.85; }

  .disclaimer { font-size:11px; color:var(--text-light); padding:16px 20px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); line-height:1.75; margin-bottom:24px; font-weight:500; box-shadow:var(--shadow); }
  .footer { text-align:center; padding:20px; font-size:11px; color:var(--text-light); border-top:1px solid var(--border); font-weight:600; letter-spacing:.5px; }
  .empty { text-align:center; padding:80px 20px; }
  .empty h2 { font-size:20px; font-weight:800; color:var(--text); margin-bottom:8px; }
  .empty p  { font-size:13px; color:var(--text-light); font-weight:500; }

  @media print {
    body { background:white; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .toolbar,.nav-bar,.filter-bar { display:none !important; }
    .kpi,.issue-item,.partial-item { break-inside:avoid; }
  }
  @media (max-width:700px) {
    .kpi-grid,.two-col { grid-template-columns:1fr; }
    .main,.header,.toolbar,.nav-bar,.filter-bar { padding-left:16px; padding-right:16px; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <div>
      <div class="header-title">Tex QA Dashboard</div>
    </div>
    <div class="header-right">
      <div class="header-date" id="header-date"></div>
    </div>
  </div>
  <div class="header-tags" id="header-tags"></div>
</header>

<div class="toolbar">
  <a href="index.html" class="toolbar-btn">&#8592; Back</a>
  <button class="toolbar-btn primary" onclick="exportPDF()">&#8659; Export PDF</button>
  <button class="toolbar-btn accent" onclick="exportCSV()">&#8595; Export CSV</button>
</div>

<nav class="nav-bar">
  <button class="tab-btn active" data-env="all">All</button>
  <button class="tab-btn" data-env="production">Production</button>
  <button class="tab-btn" data-env="staging">Staging</button>
  <div class="nav-sep"></div>
  <span class="type-lbl">Type</span>
  <button class="pill-btn active" data-type="all">All</button>
  <button class="pill-btn" data-type="criteria">Criteria</button>
  <button class="pill-btn" data-type="custom">Custom</button>
  <button class="pill-btn" data-type="feedback">Feedback</button>
</nav>

<div class="filter-bar">
  <div class="filter-group">
    <label for="run-select">Run</label>
    <select id="run-select"></select>
  </div>
  <div class="filter-group">
    <label for="date-from">From</label>
    <input type="date" id="date-from" />
    <label style="color:var(--text-light)">–</label>
    <input type="date" id="date-to" />
  </div>
</div>

<main class="main" id="main"></main>
<footer class="footer" id="footer">Tex QA · Weber Ranch</footer>

<script>
let allRuns = [], currentRun = null, activeEnv = 'all', activeType = 'all';
let dateFrom = '', dateTo = '';

function filteredRuns() {
  return allRuns.filter(r => {
    const e = r.environment || 'production';
    const t = r.test_type   || 'criteria';
    const d = r.date        || '';
    return (activeEnv  === 'all' || e === activeEnv) &&
           (activeType === 'all' || t === activeType) &&
           (!dateFrom  || d >= dateFrom) &&
           (!dateTo    || d <= dateTo);
  });
}

function esc(s) { return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(d) {
  if (!d) return '—';
  return new Date(d+'T00:00:00').toLocaleDateString('en-US',{day:'numeric',month:'long',year:'numeric'});
}
function pct(n,t) { return t ? Math.round((n/t)*100) : 0; }

function updateHeader() {
  if (!currentRun) return;
  const env  = currentRun.environment || 'production';
  const type = currentRun.test_type   || 'criteria';
  const label = currentRun.label || fmtDate(currentRun.date);
  const weekBadge = currentRun.week ? `<span class="badge week">${esc(currentRun.week)}</span>` : '';
  document.getElementById('header-tags').innerHTML =
    `<span class="badge ${env}">${esc(env)}</span>` +
    `<span class="badge ${type}">${esc(type)}</span>` +
    weekBadge;
  document.getElementById('header-date').innerHTML =
    `<strong>${esc(label)}</strong>`;
  document.getElementById('footer').textContent =
    `Tex QA Dashboard · ${esc(type)} · ${esc(label)}`;
}

function updateRunSelector() {
  const runs = filteredRuns();
  const sel  = document.getElementById('run-select');
  sel.innerHTML = runs.length
    ? runs.map((r,i) => {
        const tags = [
          activeEnv  === 'all' ? (r.environment||'prod') : null,
          activeType === 'all' ? (r.test_type||'criteria') : null,
        ].filter(Boolean).join(' · ');
        const lbl = (r.label||r.date||`Run ${i+1}`) + (tags ? `  [${tags}]` : '');
        return `<option value="${i}" ${r===currentRun?'selected':''}>${esc(lbl)}</option>`;
      }).join('')
    : '<option>No runs match filters</option>';
}

function buildIssueTracker(r, prevRun) {
  const cats = Object.entries(r.categories||{});
  if (!cats.length) return '';
  const prevCats = prevRun ? (prevRun.categories||{}) : {};
  const resolved = cats.filter(([,v])=>pct((v.pass||0)+(v.partial||0),v.total||0)>=80).length;

  const rows = cats.sort((a,b)=>a[0].localeCompare(b[0])).map(([name,v]) => {
    const total=v.total||0, passing=(v.pass||0)+(v.partial||0);
    const rate = pct(passing,total);
    const isRes = rate >= 80;
    let deltaHTML = '';
    if (prevCats[name]) {
      const pv = prevCats[name];
      const prevRate = pct((pv.pass||0)+(pv.partial||0), pv.total||0);
      const diff = rate - prevRate;
      if (diff > 0)      deltaHTML = `<span class="issue-delta up">↑ from ${prevRate}%</span>`;
      else if (diff < 0) deltaHTML = `<span class="issue-delta down">↓ from ${prevRate}%</span>`;
      else               deltaHTML = `<span class="issue-delta same">→ maintained</span>`;
    }
    return `
      <div class="issue-item">
        <div><span class="issue-name">${esc(name)}</span> <span class="issue-count">· ${total} variant${total!==1?'s':''} tested</span></div>
        <div class="issue-item-row">
          <span class="issue-score">${passing}/${total}</span>
          <span class="issue-pct">(${rate}%)</span>
          ${deltaHTML}
          ${isRes ? `<span class="resolved-chip">Resolved</span>` : `<span class="open-chip">Open</span>`}
          <span class="issue-date">${esc(r.date||'')}</span>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="section-label">Issue Tracker</div>
    <div class="issue-list">
      <div class="issue-header-card">
        <h3>Feedback Issues — Results</h3>
        <p>Resolved = 80%+ pass rate &nbsp;·&nbsp; ${resolved} of ${cats.length} resolved</p>
      </div>
      ${rows}
    </div>`;
}

function render() {
  const runs = filteredRuns();
  if (!runs.length) {
    document.getElementById('main').innerHTML = `<div class="empty"><h2>No data</h2><p>No runs match the current filters.</p></div>`;
    return;
  }
  if (!currentRun || !runs.includes(currentRun)) currentRun = runs[runs.length-1];
  updateHeader(); updateRunSelector();

  const r        = currentRun;
  const rIdx     = runs.indexOf(r);
  const prevRun  = rIdx > 0 ? runs[rIdx-1] : null;
  const total    = r.total  || 0;
  const passed   = r.pass   || 0;
  const partial  = r.partial|| 0;
  const failed   = r.fail   || 0;
  const errored  = r.error  || 0;
  const overrideKey = `overrides_${r.date}_${r.environment||'prod'}_${r.test_type||'criteria'}`;
  let overrides = {};
  try { overrides = JSON.parse(localStorage.getItem(overrideKey)||'{}'); } catch(e){}
  const overrideCount = Object.keys(overrides).length;
  const passRate = total ? Math.round(((passed + partial + overrideCount) / total) * 100) : (r.pass_rate ?? 0);
  const isFB     = (r.test_type||'criteria') === 'feedback';
  const cats     = Object.entries(r.categories||{});
  const cleanCats= cats.filter(([,v])=>!(v.fail||0)&&!(v.partial||0)).length;
  const resolved = isFB ? cats.filter(([,v])=>pct((v.pass||0)+(v.partial||0),v.total||0)>=80).length : null;

  const warnBanner = isFB ? `
    <div class="warn-banner">
      <span>⚠️</span>
      <span>This report covers <strong>issue-specific tests</strong> only — targeted tests raised against known feedback items. General scheduled test results are tracked separately.</span>
    </div>` : '';

  const summaryText = isFB
    ? `Issue-specific test run · ${esc(r.label||fmtDate(r.date))} · ${cats.length} issues tracked · ${total} test variants run · Overall pass rate <strong>${passRate}%</strong>${resolved!==null?` · ${resolved} of ${cats.length} issues resolved`:''}`
    : `${esc(r.test_type||'Criteria')} test run · ${esc(r.label||fmtDate(r.date))} · ${total} tests across ${cats.length} categories · Pass rate <strong>${passRate}%</strong>${cleanCats===cats.length?' · All categories clean':''}`;

  const kpi3Val = isFB ? failed  : partial;
  const kpi3Lbl = isFB ? 'Failures' : 'Partials';
  const kpi3Sub = isFB
    ? `<span class="chip ${failed===0?'green':'red'}">${pct(failed,total)}% fail rate</span>`
    : `<span class="chip amber">to monitor</span>`;
  const kpi4Val = isFB ? (resolved??cleanCats) : cleanCats;
  const kpi4Lbl = isFB ? 'Issues Resolved' : 'Clean Categories';
  const kpi4Sub = `<span class="chip green">of ${cats.length} ${isFB?'tracked':'categories'}</span>`;

  const splitCard = `
    <div class="card">
      <h3>Results Split</h3>
      <p class="card-sub">${esc(r.label||fmtDate(r.date))} — ${total} tests</p>
      <div class="donut-wrap">
        <svg id="donut-svg" width="120" height="120" viewBox="0 0 110 110"></svg>
        <div class="donut-legend">
          ${[[passed,'#258ed8','Pass'],[partial,'#f0c040','Partial'],[failed,'#b91c1c','Fail'],[errored,'#9ea3b8','Error']].filter(([v])=>v>0).map(([v,c,l])=>`
            <div class="legend-item"><span class="legend-dot" style="background:${c}"></span>${esc(l)}<span class="legend-val">${v}</span></div>`).join('')}
        </div>
      </div>
    </div>`;

  const catHTML = !isFB ? `
    <div class="two-col">
      <div class="card">
        <h3>By Category</h3>
        <p class="card-sub">Pass rate per test category</p>
        <div class="cat-bars">
          ${cats.sort((a,b)=>a[0].localeCompare(b[0])).map(([name,v]) => {
            const t=v.total||0, p=(v.pass||0)+(v.partial||0), f=v.fail||0;
            const cp=pct(p,t), fc=f>0?'fail':(v.partial||0)>0?'partial':'full';
            return `<div class="cat-row">
              <div class="cat-label"><span>${esc(name)}</span><span class="cat-pct">${cp}%&nbsp;(${p}/${t})</span></div>
              <div class="bar-track"><div class="bar-fill ${fc}" style="width:${cp}%"></div></div>
            </div>`;
          }).join('')}
        </div>
      </div>
      ${splitCard}
    </div>` : `<div style="margin-bottom:28px">${splitCard}</div>`;

  const issueHTML = isFB ? buildIssueTracker(r, prevRun) : '';

  function testCard(t, typeClass) {
    const oid = t.id || t.name;
    const isOverridden = !!overrides[oid];
    const criteriaStr = t.criteria_failed||t.critical_failures||t.high_failures||'';
    const critTags = criteriaStr.split(/[,;|]/).map(s=>s.trim()).filter(Boolean)
      .map(c=>`<span class="criteria-tag ${typeClass==='warn'?'warn':''}">${esc(c)}</span>`).join('');
    const screenshotLink = t.screenshot_path
      ? `<a class="link-btn" href="${esc(t.screenshot_path)}" target="_blank">📸 Screenshot</a>` : '';
    const convLink = t.conversation_path
      ? `<a class="link-btn" href="${esc(t.conversation_path)}" target="_blank">💬 Conversation</a>` : '';
    const overriddenBadge = isOverridden ? `<span class="override-note">✓ Manually passed</span>` : '';
    return `
      <div class="partial-item ${isOverridden?'overridden':''}" id="card_${esc(oid)}">
        <div class="partial-header">
          <span class="partial-name">${esc(t.name)}</span>
          <span class="partial-badge">${esc(t.score||typeClass==='warn'?'Partial':'Fail')}</span>
        </div>
        <div class="partial-footer">
          ${critTags}
          ${screenshotLink}
          ${convLink}
          ${overriddenBadge}
          <button class="override-btn ${isOverridden?'active':''}" onclick="toggleOverride('${esc(oid)}','${esc(overrideKey)}')" style="margin-left:auto">
            ${isOverridden?'↩ Undo override':'✓ Mark as pass'}
          </button>
        </div>
      </div>`;
  }

  const partials = r.partials||[];
  const partialsHTML = !isFB && partials.length ? `
    <div class="section-label">Partials to Monitor</div>
    <div class="partial-list">
      ${partials.map(p=>testCard(p,'warn')).join('')}
    </div>` : '';

  const failTests = !isFB ? (r.tests||[]).filter(t=>t.status==='FAIL') : [];
  const failsHTML = failTests.length ? `
    <div class="section-label">Failing Tests</div>
    <div class="fail-list">
      ${failTests.map(t=>testCard(t,'fail')).join('')}
    </div>` : '';

  document.getElementById('main').innerHTML = `
    ${warnBanner}
    <div class="section-label">Summary</div>
    <div class="summary-card">${summaryText}</div>
    <div class="section-label">Test Results</div>
    <div class="kpi-grid">
      <div class="kpi">
        <div class="kpi-label">Pass Rate</div>
        <div class="kpi-num">${passRate}<span class="unit">%</span></div>
        <div><span class="chip green">${passed+partial} of ${total} passing</span></div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Tests Run</div>
        <div class="kpi-num">${total}</div>
        <div><span class="chip blue">${isFB?'issue-specific variants':cats.length+' categories'}</span></div>
      </div>
      <div class="kpi">
        <div class="kpi-label">${kpi3Lbl}</div>
        <div class="kpi-num">${kpi3Val}</div>
        <div>${kpi3Sub}</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">${kpi4Lbl}</div>
        <div class="kpi-num">${kpi4Val}</div>
        <div>${kpi4Sub}</div>
      </div>
    </div>
    <div class="section-label">Breakdown</div>
    ${buildTrendHTML(runs)}
    ${catHTML}
    ${issueHTML}
    ${failsHTML}
    ${partialsHTML}
    <div class="disclaimer">
      Results reflect automated ${esc(r.test_type||'criteria')} testing against the ${esc(r.environment||'production')} environment${r.date?' on '+esc(fmtDate(r.date)):''}.
      ${failed>0?`${failed} test${failed>1?'s':''} failed defined criteria thresholds.`:'All tests passed defined criteria thresholds.'}
      ${partial>0?` ${partial} partial result${partial>1?'s':''} indicate responses where one criterion was not fully met but overall behaviour was correct.`:''} Tests should be reviewed alongside manual testing.
    </div>`;

  drawDonut(
    [[passed,'#258ed8'],[partial,'#f0c040'],[failed,'#b91c1c'],[errored,'#9ea3b8']].filter(([v])=>v>0),
    total, passRate
  );
}

function drawDonut(slices, total, passRate) {
  const svg = document.getElementById('donut-svg');
  if (!svg || !total) return;
  const cx=55, cy=55, r=40, sw=13, circ=2*Math.PI*r;
  let offset=0, arcs='';
  slices.forEach(([v,c]) => {
    const d = (v/total)*circ;
    arcs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${c}" stroke-width="${sw}" stroke-dasharray="${d} ${circ-d}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset += d;
  });
  svg.innerHTML = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#f0f2f5" stroke-width="${sw}"/>` + arcs +
    `<text x="${cx}" y="${cy-3}" text-anchor="middle" fill="#0f1e2d" font-size="16" font-weight="800" font-family="Montserrat">${passRate}%</text>` +
    `<text x="${cx}" y="${cy+12}" text-anchor="middle" fill="#9ea3b8" font-size="8" font-family="Montserrat" font-weight="600" letter-spacing="0.5">PASS RATE</text>`;
}

function buildTrendHTML(runs) {
  const sorted = [...runs].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  if (sorted.length < 2) return '';
  const W=820, H=160, pad={t:40,b:32,l:36,r:20};
  const iW=W-pad.l-pad.r, iH=H-pad.t-pad.b;
  const vals   = sorted.map(r=>r.pass_rate??pct(r.pass||0,r.total||1));
  const minV   = Math.max(0,   Math.min(...vals)-15);
  const maxV   = Math.min(100, Math.max(...vals)+15);
  const xStep  = iW / Math.max(vals.length-1, 1);
  const yScale = v => iH - ((v-minV)/(maxV-minV||1))*iH;
  const pts    = vals.map((v,i) => [pad.l+i*xStep, pad.t+yScale(v)]);
  const area   = `M ${pts[0].join(',')} ` + pts.slice(1).map(p=>`L ${p.join(',')}`).join(' ') +
    ` L ${pts[pts.length-1][0]},${pad.t+iH} L ${pad.l},${pad.t+iH} Z`;
  const line   = `M ${pts[0].join(',')} ` + pts.slice(1).map(p=>`L ${p.join(',')}`).join(' ');

  const yGrid = [0,50,100].map(v => {
    const y = pad.t + yScale(Math.max(minV,Math.min(maxV,v)));
    return `<line x1="${pad.l}" y1="${y}" x2="${pad.l+iW}" y2="${y}" stroke="#eaecf4" stroke-width="1"/>
            <text x="${pad.l-8}" y="${y+4}" text-anchor="end" font-size="9" fill="#9ea3b8" font-family="Montserrat" font-weight="600">${v}%</text>`;
  }).join('');

  const dots = pts.map(([x,y],i) => {
    const v   = vals[i];
    const sel = sorted[i] === currentRun;
    const c   = sel ? '#137333' : '#258ed8';
    return `<circle cx="${x}" cy="${y}" r="${sel?6:4}" fill="${c}" stroke="#fff" stroke-width="2.5"/>
            <text x="${x}" y="${y-13}" text-anchor="middle" font-size="10" font-weight="700" fill="${c}" font-family="Montserrat">${v}%</text>
            <text x="${x}" y="${H-6}" text-anchor="middle" font-size="9" fill="#9ea3b8" font-family="Montserrat" font-weight="600">${esc((sorted[i].label||sorted[i].date||'').slice(0,8))}</text>`;
  }).join('');

  return `
    <div class="trend-card">
      <h3>Pass Rate Over Time</h3>
      <p class="card-sub">Across all test runs to date</p>
      <div class="trend-wrap">
        <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="max-width:100%;display:block">
          <defs>
            <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#258ed8" stop-opacity=".1"/>
              <stop offset="100%" stop-color="#258ed8" stop-opacity="0"/>
            </linearGradient>
          </defs>
          ${yGrid}
          <path d="${area}" fill="url(#tg)"/>
          <path d="${line}" fill="none" stroke="#258ed8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
          ${dots}
        </svg>
      </div>
    </div>`;
}

function toggleOverride(testId, overrideKey) {
  let overrides = {};
  try { overrides = JSON.parse(localStorage.getItem(overrideKey)||'{}'); } catch(e){}
  if (overrides[testId]) {
    delete overrides[testId];
  } else {
    overrides[testId] = { overriddenAt: new Date().toISOString() };
  }
  localStorage.setItem(overrideKey, JSON.stringify(overrides));
  render(); // re-render to reflect updated overrides and recalculate KPIs
}

function exportCSV() {
  if (!currentRun) return;
  const tests = currentRun.tests||[];
  if (!tests.length) { alert('No test data for this run.'); return; }
  const headers = ['test_id','name','category','status','score','summary'];
  const rows    = tests.map(t=>headers.map(h=>`"${String(t[h]||'').replace(/"/g,'""')}"`).join(','));
  const csv     = [headers.join(','),...rows].join('\r\n');
  const blob    = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url     = URL.createObjectURL(blob);
  const a       = document.createElement('a');
  a.href=url; a.download=`tex-qa-${currentRun.date||'run'}.csv`; a.click();
  URL.revokeObjectURL(url);
}
function exportPDF() { window.print(); }

function bindNav() {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); activeEnv=btn.dataset.env; currentRun=null; render();
  }));
  document.querySelectorAll('.pill-btn').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.pill-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); activeType=btn.dataset.type; currentRun=null; render();
  }));
  document.getElementById('run-select').addEventListener('change', e => {
    currentRun = filteredRuns()[parseInt(e.target.value,10)]; render();
  });
  document.getElementById('date-from').addEventListener('change', e => { dateFrom=e.target.value; currentRun=null; render(); });
  document.getElementById('date-to').addEventListener('change',   e => { dateTo  =e.target.value; currentRun=null; render(); });
}

async function init() {
  bindNav();
  try {
    const resp = await fetch('reports/qa_results.json');
    if (!resp.ok) throw new Error();
    const data = await resp.json();
    allRuns = (data.runs||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    if (allRuns.length) {
      const dates = allRuns.map(r=>r.date).filter(Boolean).sort();
      if (dates.length) {
        document.getElementById('date-from').value = dates[0];
        document.getElementById('date-to').value   = dates[dates.length-1];
        dateFrom=dates[0]; dateTo=dates[dates.length-1];
      }
    }
    if (!allRuns.length) {
      document.getElementById('main').innerHTML = `<div class="empty"><h2>No data yet</h2><p>Run the test suite to generate results.</p></div>`;
      return;
    }
    // Storage warning: count distinct screenshot dates across all runs
    const screenshotDates = new Set(
      allRuns.flatMap(r => (r.tests||[])
        .filter(t => t.screenshot_local)
        .map(t => t.screenshot_local.split('/')[1])
      ).filter(Boolean)
    );
    if (screenshotDates.size > 10) {
      const banner = document.createElement('div');
      banner.id = 'storage-warn';
      banner.style.cssText = 'background:#fef9e7;border-bottom:1px solid #fde68a;padding:10px 40px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;color:#7a5200;';
      banner.innerHTML = `
        <span style="font-size:16px;">⚠️</span>
        <span>Screenshot storage: <strong>${screenshotDates.size} dated folders</strong> in the repo (limit is 10). Clean up old folders to keep the repo lean.</span>
        <a href="https://github.com/elizabetha1a5i/alabai-tex-runner/actions/workflows/cleanup_screenshots.yml"
           target="_blank"
           style="margin-left:auto;background:#258ed8;color:#fff;border-radius:8px;padding:5px 14px;text-decoration:none;font-size:12px;font-weight:700;white-space:nowrap;">
          Run Cleanup →
        </a>`;
      document.querySelector('.toolbar').after(banner);
    }
    render();
  } catch(e) {
    document.getElementById('main').innerHTML = `<div class="empty"><h2>No data yet</h2><p>Run the test suite to generate results.</p></div>`;
  }
}
document.addEventListener('DOMContentLoaded', init);
</script>
