<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tex QA Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f5f5f5;
      color: #111827;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Header ── */
    .header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 60px;
      flex-wrap: wrap;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1 1 auto;
      flex-wrap: wrap;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
      white-space: nowrap;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 2px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
    .chip-green { background: #dcfce7; color: #15803d; }
    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
      white-space: nowrap;
    }
    .header-powered {
      font-size: 11px;
      color: #6b7280;
      font-weight: 500;
    }
    .header-lastrun {
      font-size: 11px;
      color: #9ca3af;
    }

    /* ── Tab bar ── */
    .tab-bar {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 0 24px;
      display: flex;
      align-items: flex-end;
      gap: 0;
    }
    .tab-btn {
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 500;
      color: #6b7280;
      border: none;
      border-bottom: 2px solid transparent;
      background: none;
      cursor: pointer;
      transition: color .15s, border-color .15s;
      white-space: nowrap;
      font-family: inherit;
    }
    .tab-btn:hover { color: #374151; }
    .tab-btn.active { color: #111827; border-bottom-color: #22c55e; font-weight: 600; }

    /* ── Type filter pills ── */
    .type-filter-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px 24px 0;
      flex-wrap: wrap;
    }
    .type-filter-label {
      font-size: 12px;
      font-weight: 500;
      color: #6b7280;
      margin-right: 4px;
    }
    .pill-btn {
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid #e5e7eb;
      background: #fff;
      color: #6b7280;
      cursor: pointer;
      transition: all .15s;
      font-family: inherit;
    }
    .pill-btn:hover { border-color: #22c55e; color: #374151; }
    .pill-btn.active { background: #22c55e; border-color: #22c55e; color: #fff; font-weight: 600; }

    /* ── Page ── */
    .page { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }

    /* ── Empty state ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 340px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
      color: #6b7280;
      gap: 10px;
      padding: 40px;
      text-align: center;
    }
    .empty-state svg { opacity: .35; }
    .empty-state h2 { font-size: 16px; font-weight: 600; color: #374151; }
    .empty-state p { font-size: 13px; }

    /* ── Run selector ── */
    .controls-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .controls-bar label {
      font-size: 13px;
      font-weight: 500;
      color: #374151;
    }
    select {
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      font-family: inherit;
      background: #fff;
      color: #111827;
      cursor: pointer;
      outline: none;
      transition: border-color .15s;
    }
    select:focus { border-color: #22c55e; box-shadow: 0 0 0 2px rgba(34,197,94,.15); }

    /* ── Summary cards ── */
    .summary-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }
    @media (max-width: 700px) {
      .summary-cards { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 380px) {
      .summary-cards { grid-template-columns: 1fr; }
    }
    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07), 0 0 0 1px rgba(0,0,0,.03);
      padding: 18px 20px;
    }
    .card-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #6b7280;
      margin-bottom: 6px;
    }
    .card-value {
      font-size: 32px;
      font-weight: 700;
      line-height: 1.1;
    }
    .card-sub {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 4px;
    }
    .green { color: #22c55e; }
    .amber { color: #f59e0b; }
    .red   { color: #ef4444; }
    .grey  { color: #6b7280; }
    .blue  { color: #3b82f6; }

    /* ── Charts row ── */
    .charts-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 24px;
    }
    @media (max-width: 700px) {
      .charts-row { grid-template-columns: 1fr; }
    }
    .chart-card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07), 0 0 0 1px rgba(0,0,0,.03);
      padding: 18px 20px;
    }
    .chart-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #6b7280;
      margin-bottom: 14px;
    }
    .chart-wrap { position: relative; height: 200px; }

    /* ── Filter bar ── */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .filter-bar input[type="text"] {
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      font-family: inherit;
      background: #fff;
      color: #111827;
      outline: none;
      min-width: 180px;
      flex: 1 1 180px;
      transition: border-color .15s;
    }
    .filter-bar input[type="text"]:focus {
      border-color: #22c55e;
      box-shadow: 0 0 0 2px rgba(34,197,94,.15);
    }
    .filter-bar input[type="text"]::placeholder { color: #9ca3af; }

    /* ── Table ── */
    .table-card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07), 0 0 0 1px rgba(0,0,0,.03);
      padding: 18px 20px;
      margin-bottom: 24px;
    }
    .table-section-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #6b7280;
      margin-bottom: 14px;
    }
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    thead th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #9ca3af;
      padding: 8px 10px;
      border-bottom: 1px solid #f3f4f6;
      white-space: nowrap;
    }
    tbody tr {
      border-bottom: 1px solid #f9fafb;
      transition: background .1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f9fafb; }
    td {
      padding: 9px 10px;
      vertical-align: middle;
      color: #374151;
    }
    td.id-col {
      font-family: 'Menlo', 'Consolas', monospace;
      font-size: 11px;
      color: #6b7280;
      white-space: nowrap;
    }
    td.name-col { font-weight: 500; min-width: 160px; }
    td.cat-col  { white-space: nowrap; color: #6b7280; }
    td.score-col { font-family: monospace; font-size: 12px; white-space: nowrap; }
    td.fail-col { font-size: 12px; color: #ef4444; }
    td.notes-col { font-size: 12px; color: #6b7280; max-width: 200px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .badge-pass  { background: #dcfce7; color: #15803d; }
    .badge-warn  { background: #fef3c7; color: #b45309; }
    .badge-fail  { background: #fee2e2; color: #b91c1c; }
    .badge-error { background: #f3f4f6; color: #4b5563; }

    .no-results {
      text-align: center;
      color: #9ca3af;
      padding: 32px;
      font-size: 13px;
    }

    /* ── Partials panel ── */
    .partials-section { margin-bottom: 24px; }
    .partials-header {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #6b7280;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .partials-header .count-chip {
      background: #fef3c7;
      color: #b45309;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      padding: 0 7px;
      line-height: 18px;
    }
    .partials-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }
    .partial-card {
      background: #fff;
      border: 1px solid #fde68a;
      border-left: 4px solid #f59e0b;
      border-radius: 8px;
      padding: 14px 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.05);
    }
    .partial-card-id {
      font-family: monospace;
      font-size: 11px;
      color: #9ca3af;
      margin-bottom: 2px;
    }
    .partial-card-name {
      font-weight: 600;
      font-size: 13px;
      color: #111827;
      margin-bottom: 6px;
    }
    .partial-card-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 11px;
      color: #6b7280;
      margin-bottom: 6px;
    }
    .partial-card-meta span { white-space: nowrap; }
    .partial-card-notes {
      font-size: 12px;
      color: #78716c;
      font-style: italic;
    }
    .partial-card-fail {
      font-size: 11px;
      color: #d97706;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-left">
    <h1>Tex QA Dashboard</h1>
    <span class="chip chip-green" id="header-env-chip">All Environments</span>
    <span class="chip chip-green" id="header-type-chip">All Tests</span>
  </div>
  <div class="header-right">
    <span class="header-powered">Powered by Alibi AI</span>
    <span class="header-lastrun" id="header-lastrun">—</span>
  </div>
</header>

<!-- Environment tabs -->
<nav class="tab-bar" id="env-tabs">
  <button class="tab-btn active" data-env="all">All</button>
  <button class="tab-btn" data-env="production">Production</button>
  <button class="tab-btn" data-env="staging">Staging</button>
</nav>

<!-- Test type filter pills -->
<div class="type-filter-bar" id="type-filters">
  <span class="type-filter-label">Test type:</span>
  <button class="pill-btn active" data-type="all">All</button>
  <button class="pill-btn" data-type="criteria">Criteria</button>
  <button class="pill-btn" data-type="custom">Custom</button>
  <button class="pill-btn" data-type="feedback">Feedback</button>
</div>

<!-- Main -->
<main class="page" id="main-content">
  <!-- populated by JS -->
</main>

<script>
// ── Helpers ───────────────────────────────────────────────────────────────────
const $ = (sel, ctx = document) => ctx.querySelector(sel);
const $$ = (sel, ctx = document) => [...ctx.querySelectorAll(sel)];

function statusBadge(status) {
  const map = {
    PASS:  ['badge-pass',  '&#10003;', 'PASS'],
    WARN:  ['badge-warn',  '~', 'WARN'],
    FAIL:  ['badge-fail',  '&#10005;', 'FAIL'],
    ERROR: ['badge-error', '!', 'ERROR'],
  };
  const [cls, icon, label] = map[status] || map['ERROR'];
  return `<span class="badge ${cls}">${icon} ${label}</span>`;
}

function esc(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function formatDate(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

// ── State ─────────────────────────────────────────────────────────────────────
let allRuns = [];
let currentRun = null;
let activeEnv  = 'all';
let activeType = 'all';
let lineChart  = null;
let barChart   = null;

const ENV_COLORS = {
  production: { border: '#22c55e', bg: 'rgba(34,197,94,.08)' },
  staging:    { border: '#3b82f6', bg: 'rgba(59,130,246,.08)' },
};
const ENV_LABELS = { production: 'Production', staging: 'Staging', all: 'All Environments' };
const TYPE_LABELS = { criteria: 'Criteria', custom: 'Custom', feedback: 'Feedback', all: 'All Tests' };

// ── Filtered runs ─────────────────────────────────────────────────────────────
function filteredRuns() {
  return allRuns.filter(r => {
    const envMatch  = activeEnv  === 'all' || (r.environment || 'production') === activeEnv;
    const typeMatch = activeType === 'all' || (r.test_type || 'criteria') === activeType;
    return envMatch && typeMatch;
  });
}

// ── Empty state ───────────────────────────────────────────────────────────────
function renderEmpty(msg) {
  $('#main-content').innerHTML = `
    <div class="empty-state">
      <svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="#6b7280" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M9 17v-2m3 2v-4m3 4v-6M3 21h18M3 10.5l9-7.5 9 7.5V21H3V10.5z" />
      </svg>
      <h2>No data yet</h2>
      <p>${esc(msg)}</p>
    </div>`;
}

// ── Full render ───────────────────────────────────────────────────────────────
function renderDashboard() {
  const runs = filteredRuns();
  if (runs.length === 0) {
    renderEmpty('No runs match the current filter. Try selecting All or a different test type.');
    return;
  }

  // Pick currentRun from filtered set (keep previous if still valid, else latest)
  if (!currentRun || !runs.includes(currentRun)) {
    currentRun = runs[runs.length - 1];
  }

  updateHeaderChips();
  updateHeaderLastRun();

  const main = $('#main-content');
  main.innerHTML = buildHTML(runs);
  bindFilters();
  renderLineChart(runs);
  renderBarChart();
  renderPartials();
  renderTable();
}

function updateHeaderChips() {
  const envChip = $('#header-env-chip');
  const typeChip = $('#header-type-chip');
  if (envChip)  envChip.textContent  = ENV_LABELS[activeEnv]  || activeEnv;
  if (typeChip) typeChip.textContent = TYPE_LABELS[activeType] || activeType;
}

function buildHTML(runs) {
  const r = currentRun;
  const cleanCats = Object.values(r.categories || {}).filter(c => c.fail === 0 && c.partial === 0).length;
  const totalCats = Object.keys(r.categories || {}).length;

  const runOptions = runs.map((run, i) => {
    const envTag = (run.environment && activeEnv === 'all') ? ` [${run.environment}]` : '';
    const typeTag = (run.test_type && activeType === 'all') ? ` (${run.test_type})` : '';
    return `<option value="${runs.indexOf(run)}" ${run === r ? 'selected' : ''}>${esc((run.label || run.date) + envTag + typeTag)}</option>`;
  });

  const runSelector = runs.length > 1 ? `
    <div class="controls-bar">
      <label for="run-select">Run:</label>
      <select id="run-select">${runOptions.join('')}</select>
    </div>` : '';

  const categories = Object.keys(r.categories || {});
  const catOptions = ['All', ...categories].map(c =>
    `<option value="${esc(c)}">${esc(c)}</option>`).join('');

  return `
    ${runSelector}

    <div class="summary-cards">
      <div class="card">
        <div class="card-label">Pass Rate</div>
        <div class="card-value green">${r.pass_rate ?? Math.round((r.pass / r.total) * 100)}%</div>
        <div class="card-sub">${r.pass} of ${r.total} tests</div>
      </div>
      <div class="card">
        <div class="card-label">Tests Run</div>
        <div class="card-value">${r.total}</div>
        <div class="card-sub">${r.label || r.date}</div>
      </div>
      <div class="card">
        <div class="card-label">Partials</div>
        <div class="card-value amber">${r.partial ?? 0}</div>
        <div class="card-sub">need monitoring</div>
      </div>
      <div class="card">
        <div class="card-label">Clean Categories</div>
        <div class="card-value green">${cleanCats}<span style="font-size:16px;color:#9ca3af"> / ${totalCats}</span></div>
        <div class="card-sub">0 fail &amp; 0 partial</div>
      </div>
    </div>

    <div class="charts-row">
      <div class="chart-card">
        <div class="chart-title">Pass Rate Over Time</div>
        <div class="chart-wrap"><canvas id="lineChart"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Category Breakdown</div>
        <div class="chart-wrap"><canvas id="barChart"></canvas></div>
      </div>
    </div>

    <div class="table-card">
      <div class="table-section-title">Test Results</div>
      <div class="filter-bar">
        <select id="filter-cat">${catOptions}</select>
        <select id="filter-status">
          <option value="All">All Statuses</option>
          <option value="PASS">PASS</option>
          <option value="WARN">WARN</option>
          <option value="FAIL">FAIL</option>
          <option value="ERROR">ERROR</option>
        </select>
        <input type="text" id="filter-search" placeholder="Search by name or ID…" />
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Category</th>
              <th>Status</th>
              <th>Score</th>
              <th>Failures</th>
              <th>Notes</th>
            </tr>
          </thead>
          <tbody id="results-tbody"></tbody>
        </table>
        <div id="no-results" class="no-results" style="display:none">No matching tests.</div>
      </div>
    </div>

    <div id="partials-section" class="partials-section" style="display:none"></div>
  `;
}

// ── Line chart ────────────────────────────────────────────────────────────────
function renderLineChart(runs) {
  const ctx = $('#lineChart');
  if (!ctx) return;
  if (lineChart) { lineChart.destroy(); lineChart = null; }

  const sorted = [...runs].sort((a, b) => (a.date || '').localeCompare(b.date || ''));

  let datasets;
  if (activeEnv === 'all') {
    // Separate line per environment
    const envGroups = {};
    sorted.forEach(r => {
      const env = r.environment || 'production';
      if (!envGroups[env]) envGroups[env] = [];
      envGroups[env].push(r);
    });

    // Build a unified x-axis from all dates
    const allDates = [...new Set(sorted.map(r => r.date || ''))].sort();
    const labels = allDates.map(d => {
      const run = sorted.find(r => r.date === d);
      return run ? (run.label || run.date) : d;
    });

    datasets = Object.entries(envGroups).map(([env, envRuns]) => {
      const color = ENV_COLORS[env] || { border: '#6b7280', bg: 'rgba(107,114,128,.08)' };
      const dataMap = {};
      envRuns.forEach(r => { dataMap[r.date || ''] = r.pass_rate ?? Math.round((r.pass / r.total) * 100); });
      return {
        label: ENV_LABELS[env] || env,
        data: allDates.map(d => dataMap[d] ?? null),
        borderColor: color.border,
        backgroundColor: color.bg,
        pointBackgroundColor: color.border,
        pointRadius: 4,
        pointHoverRadius: 6,
        borderWidth: 2,
        tension: 0.3,
        fill: false,
        spanGaps: true,
      };
    });

    lineChart = new Chart(ctx, {
      type: 'line',
      data: { labels, datasets },
      options: chartLineOptions(true),
    });
  } else {
    const labels = sorted.map(r => r.label || r.date);
    const data   = sorted.map(r => r.pass_rate ?? Math.round((r.pass / r.total) * 100));
    const color  = ENV_COLORS[activeEnv] || { border: '#22c55e', bg: 'rgba(34,197,94,.08)' };

    lineChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: 'Pass Rate %',
          data,
          borderColor: color.border,
          backgroundColor: color.bg,
          pointBackgroundColor: color.border,
          pointRadius: 4,
          pointHoverRadius: 6,
          borderWidth: 2,
          tension: 0.3,
          fill: true,
        }]
      },
      options: chartLineOptions(false),
    });
  }
}

function chartLineOptions(showLegend) {
  return {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: {
        display: showLegend,
        position: 'bottom',
        labels: { font: { size: 11 }, boxWidth: 10, padding: 10 },
      },
      tooltip: {
        callbacks: { label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y}%` }
      }
    },
    scales: {
      y: {
        min: 0, max: 100,
        ticks: { callback: v => v + '%', font: { size: 11 }, color: '#9ca3af' },
        grid: { color: '#f3f4f6' },
      },
      x: {
        ticks: { font: { size: 11 }, color: '#9ca3af' },
        grid: { display: false },
      }
    }
  };
}

// ── Bar chart ─────────────────────────────────────────────────────────────────
function renderBarChart() {
  const ctx = $('#barChart');
  if (!ctx) return;
  if (barChart) { barChart.destroy(); barChart = null; }

  const cats = Object.entries(currentRun.categories || {});
  const labels  = cats.map(([k]) => k);
  const pass    = cats.map(([, v]) => v.pass    ?? 0);
  const partial = cats.map(([, v]) => v.partial ?? 0);
  const fail    = cats.map(([, v]) => v.fail    ?? 0);

  barChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Pass',    data: pass,    backgroundColor: '#22c55e' },
        { label: 'Partial', data: partial, backgroundColor: '#f59e0b' },
        { label: 'Fail',    data: fail,    backgroundColor: '#ef4444' },
      ]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'bottom',
          labels: { font: { size: 11 }, boxWidth: 10, padding: 10 }
        }
      },
      scales: {
        x: {
          stacked: true,
          ticks: { font: { size: 11 }, color: '#9ca3af', precision: 0 },
          grid: { color: '#f3f4f6' },
        },
        y: {
          stacked: true,
          ticks: { font: { size: 11 }, color: '#6b7280' },
          grid: { display: false },
        }
      }
    }
  });
}

// ── Table ─────────────────────────────────────────────────────────────────────
function allTests() {
  const tests    = (currentRun.tests    || []).map(t => ({ ...t, status: t.status || 'PASS' }));
  const partials = (currentRun.partials || []).map(t => ({ ...t, status: t.status || 'WARN' }));
  return [...tests, ...partials];
}

function renderTable() {
  const cat    = $('#filter-cat')?.value    || 'All';
  const status = $('#filter-status')?.value || 'All';
  const search = ($('#filter-search')?.value || '').toLowerCase().trim();

  let rows = allTests();

  if (cat !== 'All')    rows = rows.filter(r => r.category === cat);
  if (status !== 'All') rows = rows.filter(r => r.status === status);
  if (search)           rows = rows.filter(r =>
    (r.id   || '').toLowerCase().includes(search) ||
    (r.name || '').toLowerCase().includes(search)
  );

  rows.sort((a, b) => {
    const cc = (a.category || '').localeCompare(b.category || '');
    if (cc !== 0) return cc;
    return (a.id || '').localeCompare(b.id || '');
  });

  const tbody = $('#results-tbody');
  const noRes = $('#no-results');
  if (!tbody) return;

  if (rows.length === 0) {
    tbody.innerHTML = '';
    if (noRes) noRes.style.display = 'block';
    return;
  }
  if (noRes) noRes.style.display = 'none';

  const failures = r => [r.critical_failures, r.high_failures].filter(Boolean).join(', ');

  tbody.innerHTML = rows.map(r => `
    <tr>
      <td class="id-col">${esc(r.id)}</td>
      <td class="name-col">${esc(r.name)}</td>
      <td class="cat-col">${esc(r.category)}</td>
      <td>${statusBadge(r.status)}</td>
      <td class="score-col">${esc(r.score)}</td>
      <td class="fail-col">${esc(failures(r))}</td>
      <td class="notes-col">${esc(r.notes)}</td>
    </tr>`).join('');
}

// ── Partials panel ────────────────────────────────────────────────────────────
function renderPartials() {
  const section = $('#partials-section');
  if (!section) return;
  const partials = currentRun.partials || [];
  if (partials.length === 0) { section.style.display = 'none'; return; }

  section.style.display = 'block';
  section.innerHTML = `
    <div class="partials-header">
      Partials to Monitor
      <span class="count-chip">${partials.length}</span>
    </div>
    <div class="partials-grid">
      ${partials.map(p => {
        const fails = [p.critical_failures, p.high_failures].filter(Boolean).join(', ');
        return `
          <div class="partial-card">
            <div class="partial-card-id">${esc(p.id)}</div>
            <div class="partial-card-name">${esc(p.name)}</div>
            <div class="partial-card-meta">
              <span>${esc(p.category)}</span>
              ${p.score ? `<span>Score: ${esc(p.score)}</span>` : ''}
            </div>
            ${fails ? `<div class="partial-card-fail">&#9888; ${esc(fails)}</div>` : ''}
            ${p.notes ? `<div class="partial-card-notes">${esc(p.notes)}</div>` : ''}
          </div>`;
      }).join('')}
    </div>`;
}

// ── Filter bindings ───────────────────────────────────────────────────────────
function bindFilters() {
  const cat    = $('#filter-cat');
  const status = $('#filter-status');
  const search = $('#filter-search');
  const runSel = $('#run-select');

  if (cat)    cat.addEventListener('change', renderTable);
  if (status) status.addEventListener('change', renderTable);
  if (search) search.addEventListener('input', renderTable);

  if (runSel) {
    runSel.addEventListener('change', e => {
      const runs = filteredRuns();
      currentRun = runs[parseInt(e.target.value, 10)];
      updateHeaderLastRun();
      renderBarChart();
      renderPartials();
      renderTable();
    });
  }
}

function updateHeaderLastRun() {
  const el = $('#header-lastrun');
  if (el && currentRun) el.textContent = 'Last run: ' + formatDate(currentRun.date);
}

// ── Tab / pill bindings ───────────────────────────────────────────────────────
function bindNavControls() {
  $$('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      $$('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeEnv = btn.dataset.env;
      currentRun = null;
      renderDashboard();
    });
  });

  $$('.pill-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      $$('.pill-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeType = btn.dataset.type;
      currentRun = null;
      renderDashboard();
    });
  });
}

// ── Boot ──────────────────────────────────────────────────────────────────────
async function init() {
  bindNavControls();
  try {
    const resp = await fetch('reports/qa_results.json');
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();

    allRuns = (data.runs || []).slice();
    allRuns.sort((a, b) => (a.date || '').localeCompare(b.date || ''));

    if (allRuns.length === 0) {
      renderEmpty('The JSON loaded but contains no runs. Run the test suite to populate it.');
      return;
    }

    renderDashboard();
  } catch (err) {
    console.error('QA Dashboard load error:', err);
    renderEmpty('No data yet — run the test suite to generate results.');
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
