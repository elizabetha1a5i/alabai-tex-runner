name: Dynamic Eval — MSE Methodology (Phase 1)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
      mode:
        description: "What to run"
        required: true
        default: "standard"
        type: choice
        options:
          - standard
          - custom
          - both
      limit:
        description: "Number of standard tests to run (blank = all)"
        required: false
        default: ""
      custom_name:
        description: "Custom test — name (e.g. Pour Tour Austin) — required for custom/both modes"
        required: false
        default: ""
      custom_description:
        description: "Custom test — what should Tex do? What counts as pass or fail? — required for custom/both modes"
        required: false
        default: ""

jobs:
  dynamic-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright google-genai google-auth google-auth-oauthlib google-api-python-client
          playwright install chromium --with-deps

      - name: Run dynamic evaluation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          ENV="${{ github.event.inputs.environment }}"
          CUSTOM_NAME="${{ github.event.inputs.custom_name }}"
          CUSTOM_DESC="${{ github.event.inputs.custom_description }}"
          LIMIT_ARG=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            LIMIT_ARG="--limit ${{ github.event.inputs.limit }}"
          fi

          if [ "$MODE" = "standard" ]; then
            python tex_dynamic_eval_runner.py --env $ENV $LIMIT_ARG

          elif [ "$MODE" = "custom" ]; then
            python tex_dynamic_eval_runner.py --env $ENV \
              --custom-name "$CUSTOM_NAME" \
              --custom-description "$CUSTOM_DESC"

          elif [ "$MODE" = "both" ]; then
            python tex_dynamic_eval_runner.py --env $ENV $LIMIT_ARG
            python tex_dynamic_eval_runner.py --env $ENV \
              --custom-name "$CUSTOM_NAME" \
              --custom-description "$CUSTOM_DESC"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-eval-results
          path: tex_dynamic_results.json
          retention-days: 30
