name: Dynamic Eval — MSE Methodology (Phase 1)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
      mode:
        description: "What to run"
        required: true
        default: "standard"
        type: choice
        options:
          - standard
          - custom
          - both
      limit:
        description: "Number of standard tests to run (blank = all)"
        required: false
        default: ""
      custom_name:
        description: "Custom test name(s), required for custom/both. For multiple tests separate with ||| (must match custom_description count 1:1)"
        required: false
        default: ""
      custom_description:
        description: "What Tex should do / pass-fail criteria, required for custom/both. Separate multiple with ||| to match custom_name"
        required: false
        default: ""
      custom_repeat:
        description: "Run each custom test this many times, to check consistency across repeated trials (custom/both only, blank = 1)"
        required: false
        default: ""

jobs:
  dynamic-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright google-genai google-auth google-auth-oauthlib google-api-python-client
          playwright install chromium --with-deps

      - name: Run dynamic evaluation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MODE: ${{ github.event.inputs.mode }}
          ENV: ${{ github.event.inputs.environment }}
          CUSTOM_NAME: ${{ github.event.inputs.custom_name }}
          CUSTOM_DESC: ${{ github.event.inputs.custom_description }}
          CUSTOM_REPEAT: ${{ github.event.inputs.custom_repeat }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          set -euo pipefail

          LIMIT_ARG=""
          if [ -n "${LIMIT:-}" ]; then
            LIMIT_ARG="--limit ${LIMIT}"
          fi

          REPEAT_ARG=""
          if [ -n "${CUSTOM_REPEAT:-}" ]; then
            REPEAT_ARG="--custom-repeat ${CUSTOM_REPEAT}"
          fi

          if [ "${MODE}" = "standard" ]; then
            python tex_dynamic_eval_runner.py --env "${ENV}" ${LIMIT_ARG}

          elif [ "${MODE}" = "custom" ]; then
            python tex_dynamic_eval_runner.py --env "${ENV}" \
              --custom-name "${CUSTOM_NAME}" \
              --custom-description "${CUSTOM_DESC}" \
              ${REPEAT_ARG}

          elif [ "${MODE}" = "both" ]; then
            python tex_dynamic_eval_runner.py --env "${ENV}" ${LIMIT_ARG}
            python tex_dynamic_eval_runner.py --env "${ENV}" \
              --custom-name "${CUSTOM_NAME}" \
              --custom-description "${CUSTOM_DESC}" \
              ${REPEAT_ARG}
          fi

      - name: Upload screenshots to dashboard blob storage
        if: always() && env.EVAL_DASHBOARD_URL != ''
        env:
          EVAL_DASHBOARD_URL: ${{ secrets.EVAL_DASHBOARD_URL }}
          EVAL_DASHBOARD_KEY: ${{ secrets.EVAL_DASHBOARD_KEY }}
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ ! -f tex_dynamic_results.json ]; then
            echo "No tex_dynamic_results.json found — skipping screenshot upload."
            exit 0
          fi

          for f in screenshot_*.png; do
            [ -f "$f" ] || continue
            test_id=$(echo "$f" | sed -E 's/^screenshot_(.*)\.png$/\1/')
            echo "Uploading $f for test $test_id..."
            url=$(curl -sf -X POST "${EVAL_DASHBOARD_URL}/api/upload-screenshot?filename=${f}" \
              -H "Authorization: Bearer ${EVAL_DASHBOARD_KEY}" \
              -H "Content-Type: image/png" \
              --data-binary "@${f}" | jq -r '.url // empty')
            if [ -n "$url" ]; then
              echo "  -> $url"
              tmp=$(mktemp)
              jq --arg tid "$test_id" --arg url "$url" \
                '.tests |= map(if .test_id == $tid then .screenshot_path = $url else . end)' \
                tex_dynamic_results.json > "$tmp" && mv "$tmp" tex_dynamic_results.json
            else
              echo "  -> upload failed, leaving screenshot_path as-is"
            fi
          done

      - name: Push results to eval dashboard
        if: always() && env.EVAL_DASHBOARD_URL != ''
        env:
          EVAL_DASHBOARD_URL: ${{ secrets.EVAL_DASHBOARD_URL }}
          EVAL_DASHBOARD_KEY: ${{ secrets.EVAL_DASHBOARD_KEY }}
        continue-on-error: true
        run: |
          if [ -f tex_dynamic_results.json ]; then
            curl -sf -X POST "${EVAL_DASHBOARD_URL}/api/eval-results" \
              -H "Authorization: Bearer ${EVAL_DASHBOARD_KEY}" \
              -H "Content-Type: application/json" \
              --data-binary @tex_dynamic_results.json
          else
            echo "No tex_dynamic_results.json found — skipping dashboard push."
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-eval-results
          path: |
            tex_dynamic_results.json
            tex_dynamic_results.csv
          retention-days: 30
