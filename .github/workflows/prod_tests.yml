name: Tex QA Production Tests (weberranch.com)

on:
  schedule:
    - cron: '0 10 * * *'   # 10am UTC daily (separate from staging run at 9am)
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of tests to run (leave blank for all 100)'
        required: false
        default: ''

jobs:
  run-prod-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright google-genai google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client
          playwright install chromium
          playwright install-deps chromium

      - name: Write Google credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json
          echo '${{ secrets.GOOGLE_TOKEN_JSON }}' > token.json

      - name: Run Tex QA tests (production)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -n "$LIMIT" ]; then
            python tex_qa_test_runner_prod.py --limit "$LIMIT"
          else
            python tex_qa_test_runner_prod.py
          fi

      - name: Checkout cyphr-flow for dashboard publish
        uses: actions/checkout@v4
        with:
          repository: elizabetha1a5i/cyphr-flow
          ssh-key: ${{ secrets.CYPHR_FLOW_DEPLOY_KEY }}
          path: cyphr-flow

      - name: Generate QA snapshot JSON
        run: |
          if [ ! -f tex_prod_results.csv ]; then
            echo "WARNING: tex_prod_results.csv not found — skipping snapshot"
            ls -la *.csv 2>/dev/null || echo "No CSV files in working directory"
            exit 0
          fi
          python generate_qa_snapshot.py \
            --csv tex_prod_results.csv \
            --out cyphr-flow/reports/qa_results.json \
            --environment production \
            --test-type criteria \
            --label "$(date +'%B %Y')"

      - name: Copy dashboard page to cyphr-flow
        run: |
          cp qa-dashboard.html cyphr-flow/qa-dashboard.html

      - name: Publish dashboard to cyphr-flow
        run: |
          cd cyphr-flow
          mkdir -p reports
          git config user.name  "Alibi AI"
          git config user.email "ci@alibi.ai"
          git add qa-dashboard.html
          [ -f reports/qa_results.json ] && git add reports/qa_results.json || echo "No snapshot to add"
          git diff --staged --quiet || git commit -m "QA snapshot $(date +'%Y-%m-%d') — prod test run"
          git push
