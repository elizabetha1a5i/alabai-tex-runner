name: Tex QA Scheduled Tests

on:
  schedule:
    - cron: '0 9 * * *'   # 9am UTC (10am UK summer)
    - cron: '0 17 * * *'  # 5pm UTC (6pm UK summer)
  workflow_dispatch:        # allows manual trigger from GitHub

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright google-genai google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client
          playwright install chromium
          playwright install-deps chromium

      - name: Write Google credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json
          echo '${{ secrets.GOOGLE_TOKEN_JSON }}' > token.json

      - name: Run Tex QA tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python tex_qa_test_runner_v8_no_consent.py
