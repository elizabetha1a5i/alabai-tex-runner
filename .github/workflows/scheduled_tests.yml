name: Tex QA Scheduled Tests

on:
  # schedule:             # paused - run manually via workflow_dispatch
  #   - cron: '0 9 * * *'   # 9am UTC (10am UK summer)
  #   - cron: '0 17 * * *'  # 5pm UTC (6pm UK summer)
  workflow_dispatch:        # allows manual trigger from GitHub

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright google-genai google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client
          playwright install chromium
          playwright install-deps chromium

      - name: Run Tex QA tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python tex_qa_test_runner_v8_no_consent.py

      - name: Checkout cyphr-flow for dashboard publish
        uses: actions/checkout@v4
        with:
          repository: elizabetha1a5i/cyphr-flow
          ssh-key: ${{ secrets.CYPHR_FLOW_DEPLOY_KEY }}
          path: cyphr-flow

      - name: Copy fail/partial screenshots to cyphr-flow
        run: |
          RUN_DATE=$(date +'%Y-%m-%d')
          python copy_screenshots.py \
            --csv tex_staging_results.csv \
            --dest "cyphr-flow/screenshots/$RUN_DATE"

      - name: Generate QA snapshot JSON
        run: |
          if [ ! -f tex_staging_results.csv ]; then
            echo "WARNING: tex_staging_results.csv not found — skipping snapshot"
            exit 0
          fi
          python generate_qa_snapshot.py \
            --csv tex_staging_results.csv \
            --out cyphr-flow/reports/qa_results.json \
            --environment staging \
            --test-type criteria \
            --label "$(date +'%B %Y')" \
            --screenshots-dir "cyphr-flow/screenshots/$(date +'%Y-%m-%d')"

      - name: Copy dashboard page to cyphr-flow
        run: |
          cp qa-dashboard.html cyphr-flow/qa-dashboard.html

      - name: Publish dashboard to cyphr-flow
        run: |
          cd cyphr-flow
          mkdir -p reports
          git config user.name  "Alibi AI"
          git config user.email "ci@alibi.ai"
          git add qa-dashboard.html
          [ -f reports/qa_results.json ] && git add reports/qa_results.json || echo "No snapshot to add"
          git add screenshots/ 2>/dev/null || echo "No screenshots to add"
          git diff --staged --quiet || git commit -m "QA snapshot $(date +'%Y-%m-%d') — staging criteria run"
          git push
