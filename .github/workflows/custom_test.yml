name: Tex — Custom Test

on:
  workflow_dispatch:
    inputs:
      test_name:
        description: "Test name (e.g. Music Intent)"
        required: true
      test_description:
        description: "What the test is about (e.g. Tex answers questions about the Weber Ranch song)"
        required: true
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
          - production_web

jobs:
  run-custom-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install \
            google-genai \
            playwright \
            google-auth \
            google-auth-oauthlib \
            google-api-python-client

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Install xvfb
        run: sudo apt-get install -y xvfb

      - name: Write Google credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json
          echo '${{ secrets.GOOGLE_TOKEN_JSON }}' > token.json

      - name: Run custom test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HEADLESS: "true"
          TEST_ENVIRONMENT: ${{ github.event.inputs.environment }}
          CUSTOM_TEST_NAME: ${{ github.event.inputs.test_name }}
          CUSTOM_TEST_DESCRIPTION: ${{ github.event.inputs.test_description }}
        run: xvfb-run python tex_custom_test_runner.py

      - name: Checkout cyphr-flow for dashboard publish
        uses: actions/checkout@v4
        with:
          repository: elizabetha1a5i/cyphr-flow
          ssh-key: ${{ secrets.CYPHR_FLOW_DEPLOY_KEY }}
          path: cyphr-flow

      - name: Generate QA snapshot JSON
        run: |
          if [ ! -f tex_custom_results.csv ]; then
            echo "WARNING: tex_custom_results.csv not found — skipping snapshot"
            ls -la *.csv 2>/dev/null || echo "No CSV files in working directory"
            exit 0
          fi
          python generate_qa_snapshot.py \
            --csv tex_custom_results.csv \
            --out cyphr-flow/reports/qa_results.json \
            --environment ${{ github.event.inputs.environment }} \
            --test-type custom \
            --label "$(date +'%B %Y')"

      - name: Copy dashboard page to cyphr-flow
        run: cp qa-dashboard.html cyphr-flow/qa-dashboard.html

      - name: Publish dashboard to cyphr-flow
        run: |
          cd cyphr-flow
          mkdir -p reports
          git config user.name  "Alibi AI"
          git config user.email "ci@alibi.ai"
          git add qa-dashboard.html
          [ -f reports/qa_results.json ] && git add reports/qa_results.json || echo "No snapshot to add"
          git diff --staged --quiet || git commit -m "QA snapshot $(date +'%Y-%m-%d') — custom test: ${{ github.event.inputs.test_name }}"
          git push
